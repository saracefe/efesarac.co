<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060609">

    <title>Efe Saraç | Bağlantılar</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #060609;
            --text: #ffffff;
            --muted: #858692;
            --border: rgba(255,255,255,0.09);
            --card: rgba(255,255,255,0.045);
            --card-hover: rgba(255,255,255,0.085);
            --purple: #8b5cf6;
            --blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            overflow-x: hidden;
        }

        /* ========================================
           BACKGROUND
        ======================================== */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            overflow: hidden;
            pointer-events: none;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                black 0%,
                transparent 90%
            );
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.30;
        }

        .orb-one {
            width: 430px;
            height: 430px;
            left: -180px;
            top: -180px;
            background: #5424b8;
        }

        .orb-two {
            width: 380px;
            height: 380px;
            right: -180px;
            top: 35%;
            background: #174ea6;
        }

        .orb-three {
            width: 320px;
            height: 320px;
            left: 35%;
            bottom: -180px;
            background: #7c1d70;
        }

        /* ========================================
           PAGE
        ======================================== */

        .page {
            width: min(100% - 28px, 680px);
            margin: auto;
            padding: 55px 0 35px;
        }

        /* ========================================
           PROFILE
        ======================================== */

        .profile {
            text-align: center;
            margin-bottom: 42px;
        }

        .avatar-wrap {
            position: relative;
            width: 112px;
            height: 112px;
            margin: 0 auto 20px;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;

            background:
                conic-gradient(
                    from 180deg,
                    #6366f1,
                    #a855f7,
                    #3b82f6,
                    #6366f1
                );

            animation: avatarRotate 8s linear infinite;
        }

        .avatar-ring::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--bg);
        }

        @keyframes avatarRotate {
            to {
                transform: rotate(360deg);
            }
        }

        .avatar {
            position: relative;
            z-index: 2;

            width: 112px;
            height: 112px;

            padding: 4px;

            border-radius: 50%;
            object-fit: cover;

            background: var(--bg);
        }

        .name {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        /* Mavi doğrulama tiki */

        .verified {
            width: 21px;
            height: 21px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #3b82f6;

            color: white;
            font-size: 12px;
            font-weight: 800;

            box-shadow:
                0 0 16px rgba(59,130,246,0.35);
        }

        .bio {
            margin-top: 9px;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 16px;
            padding: 7px 13px;

            border: 1px solid rgba(52,211,153,0.22);
            border-radius: 999px;

            background: rgba(52,211,153,0.07);

            color: #6ee7b7;

            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: #34d399;

            box-shadow: 0 0 12px #34d399;
        }

        /* ========================================
           SECTIONS
        ======================================== */

        .section {
            margin-top: 30px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 0 5px 11px;

            color: #777985;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .section-title::after {
            content: "";

            flex: 1;
            height: 1px;

            background: rgba(255,255,255,0.07);
        }

        /* ========================================
           LINK CARDS
        ======================================== */

        .link {
            position: relative;

            display: flex;
            align-items: center;

            min-height: 66px;

            padding: 13px 17px;
            margin-bottom: 10px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: var(--card);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            color: white;
            text-decoration: none;

            overflow: hidden;

            transition:
                transform 0.22s ease,
                background 0.22s ease,
                border-color 0.22s ease,
                box-shadow 0.22s ease;
        }

        .link::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 20%,
                    rgba(255,255,255,0.06),
                    transparent 80%
                );

            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .link:hover {
            transform: translateY(-3px);

            background: var(--card-hover);

            border-color:
                rgba(255,255,255,0.17);

            box-shadow:
                0 14px 35px rgba(0,0,0,0.25);
        }

        .link:hover::before {
            transform: translateX(100%);
        }

        .logo-box {
            width: 42px;
            height: 42px;

            flex: 0 0 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.075);

            border:
                1px solid rgba(255,255,255,0.07);
        }

        .logo {
            width: 23px;
            height: 23px;

            object-fit: contain;

            filter:
                brightness(0)
                invert(1);

            transition:
                transform 0.2s ease;
        }

        .link:hover .logo {
            transform: scale(1.08);
        }

        .link-content {
            min-width: 0;
            margin-left: 13px;
        }

        .link-name {
            font-size: 14px;
            font-weight: 600;
        }

        .link-description {
            margin-top: 3px;

            color: #777985;
            font-size: 11px;
        }

        .arrow {
            margin-left: auto;
            padding-left: 12px;

            color: #64656e;
            font-size: 21px;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .link:hover .arrow {
            color: white;
            transform: translateX(4px);
        }

        /* ========================================
           EMAIL FEATURE
        ======================================== */

        .feature {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 18px;
            margin-bottom: 10px;

            border:
                1px solid rgba(139,92,246,0.22);

            border-radius: 20px;

            background:
                radial-gradient(
                    circle at 0% 0%,
                    rgba(139,92,246,0.18),
                    transparent 55%
                ),
                rgba(255,255,255,0.045);
        }

        .feature-info {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .feature-icon {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                rgba(139,92,246,0.14);

            font-size: 20px;
        }

        .feature h3 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .feature p {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .feature-button {
            flex-shrink: 0;

            padding: 10px 14px;

            border-radius: 11px;

            background:
                rgba(255,255,255,0.11);

            border:
                1px solid rgba(255,255,255,0.13);

            color: white;

            text-decoration: none;

            font-size: 11px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .feature-button:hover {
            background:
                rgba(255,255,255,0.18);

            transform: translateY(-1px);
        }

        /* ========================================
           CONTACT
        ======================================== */

        .contact {
            margin-top: 34px;

            padding: 22px;

            border:
                1px solid rgba(255,255,255,0.09);

            border-radius: 22px;

            background:
                rgba(255,255,255,0.035);
        }

        .contact h2 {
            text-align: center;

            font-size: 16px;

            margin-bottom: 17px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input,
        .textarea {
            width: 100%;

            border:
                1px solid rgba(255,255,255,0.09);

            border-radius: 13px;

            background:
                rgba(0,0,0,0.18);

            color: white;

            padding: 13px 14px;

            outline: none;

            font-size: 13px;

            transition: 0.2s ease;
        }

        .input::placeholder,
        .textarea::placeholder {
            color: #666771;
        }

        .input:focus,
        .textarea:focus {
            border-color:
                rgba(139,92,246,0.5);

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,0.08);
        }

        .textarea {
            min-height: 105px;
            resize: vertical;
        }

        .submit {
            border: 0;
            border-radius: 13px;

            padding: 13px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(99,102,241,0.18);

            transition: 0.2s ease;
        }

        .submit:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px
                rgba(99,102,241,0.28);
        }

        /* ========================================
           PREMIUM FOOTER
        ======================================== */

        .site-footer {
            margin-top: 48px;
            padding-top: 32px;

            border-top:
                1px solid
                rgba(255,255,255,0.10);
        }

        .footer-brand {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;

            min-height: 145px;
        }

        .footer-logo {
            display: block;

            width: 150px;
            height: auto;

            max-height: 125px;

            object-fit: contain;
            object-position: left top;

            filter:
                drop-shadow(
                    0 8px 24px
                    rgba(255,255,255,0.04)
                );
        }

        .footer-country {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 42px;
            height: 28px;

            margin-top: 20px;

            border-radius: 7px;

            background: #e30a17;

            color: white;

            font-size: 16px;

            box-shadow:
                0 5px 18px
                rgba(227,10,23,0.12);
        }

        .footer-divider {
            width: 100%;
            height: 1px;

            margin: 18px 0 22px;

            background:
                rgba(255,255,255,0.10);
        }

        .copyright {
            color: #777985;

            font-size: 13px;
            line-height: 1.6;

            letter-spacing: -0.1px;
        }

        .copyright strong {
            color: #a1a2ad;
            font-weight: 500;
        }

        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 520px) {

            .page {
                width: min(100% - 22px, 680px);
                padding-top: 38px;
            }

            .profile {
                margin-bottom: 34px;
            }

            .name {
                font-size: 24px;
            }

            .link {
                min-height: 63px;
                border-radius: 16px;
            }

            .logo-box {
                width: 39px;
                height: 39px;
                flex-basis: 39px;
            }

            .link-description {
                display: none;
            }

            .feature {
                align-items: flex-start;
            }

            .feature-button {
                margin-top: 2px;
            }

            .footer-logo {
                width: 125px;
                max-height: 110px;
            }

            .footer-brand {
                min-height: 130px;
            }

            .copyright {
                font-size: 12px;
            }
        }
    </style>
</head>
