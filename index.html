<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>efesarac.co</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #8e8e93;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }
        .card {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn {
            display: inline-block;
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 10px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>efesarac.co</h1>
        <p class="subtitle">Official Brand & Contact Hub</p>
        
        <div class="card">
            <a href="mailto:contact@efesarac.co" class="btn">Business & Collabs</a>
        </div>
    </div>
</body>
</html>
