   LANGUAGE SYSTEM
========================================================= */

const languageButton=
document.getElementById("languageButton");

const languageMenu=
document.getElementById("languageMenu");

const languageOptions=
document.querySelectorAll(".language-option");

const selectedLanguageFlag=
document.getElementById("selectedLanguageFlag");

const languageCode=
document.getElementById("languageCode");


function updateLanguageButton(lang){

  const info=
    languageFlags[lang]||
    languageFlags.tr;

  const countryCode=info[0];
  const code=info[1];

  selectedLanguageFlag.src=
    `https://flagcdn.com/w80/${countryCode}.png`;

  selectedLanguageFlag.alt=
    code;

  languageCode.textContent=
    code;

}


function closeLanguageMenu(){

  languageMenu.classList.remove("open");
  languageButton.classList.remove("open");

}


function openLanguageMenu(){

  languageMenu.classList.add("open");
  languageButton.classList.add("open");

}
